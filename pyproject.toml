[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "football-vision"
version = "0.1.0"
description = "Modular computer-vision field calibration, player/ball tracking, and play analytics for American football broadcast video."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
]

[project.optional-dependencies]
experimental = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["football_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Static analysis actually enforced in CI. The rule set is deliberately narrow and
# *verifiable*: syntax errors (E9) and pyflakes-level defects (F) — undefined names,
# unused imports/variables, shadowed definitions. No style rules are gated, because
# this project has no agreed style config and a green CI must mean something.
target-version = "py310"
line-length = 110
exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The package __init__ is the public API surface: it re-exports names on purpose.
"football_vision/__init__.py" = ["F401"]
