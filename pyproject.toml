[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "football-vision"
version = "0.1.0"
description = "Modular computer-vision field calibration, player/ball tracking, and play analytics for American football broadcast video."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
]

[project.optional-dependencies]
experimental = [
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.0",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
include = ["football_vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
